<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审查报告 - 智能招投标审查平台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-layout">
    <!-- 顶部导航栏 -->
    <header class="topbar">
      <div class="topbar-logo">
        <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" width="40" height="40">
          <defs>
            <linearGradient id="shieldMain" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1E5AA8"/>
              <stop offset="50%" stop-color="#2C7BE5"/>
              <stop offset="100%" stop-color="#1E5AA8"/>
            </linearGradient>
            <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFD700"/>
              <stop offset="100%" stop-color="#B8860B"/>
            </linearGradient>
            <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E5AA8" flood-opacity="0.3"/>
            </filter>
            <filter id="badgeShadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
            </filter>
          </defs>
          <!-- 盾牌主体 -->
          <g filter="url(#shieldShadow)">
            <path d="M22 2L4 9v10c0 10 8 17 18 17s18-7 18-17V9L22 2z" fill="url(#shieldMain)"/>
          </g>
          <!-- 盾牌顶部高光 -->
          <path d="M22 2L4 9v10c0 10 8 17 18 17" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
          <!-- 盾牌底部暗部 -->
          <path d="M22 36c8.5 0 15-5.5 16-13" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
          <!-- 盾牌边缘轮廓 -->
          <path d="M22 2L4 9v10c0 10 8 17 18 17s18-7 18-17V9L22 2z" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <!-- 文档图标 -->
          <g transform="translate(14, 11)">
            <path d="M12 0H4a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V6l-4-6z" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 0v6h4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 10h6M5 13h4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </g>
          <!-- 金色徽章 -->
          <g filter="url(#badgeShadow)" transform="translate(28, 26)">
            <circle cx="8" cy="8" r="7" fill="url(#goldBadge)" stroke="#B8860B" stroke-width="0.5"/>
            <circle cx="8" cy="8" r="5.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
            <path d="M5 8l2 2 4-4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
        <span>智能招投标审查平台</span>
      </div>
      <div class="topbar-actions">
        <div class="topbar-user-dropdown">
          <div class="topbar-user">
            <div class="topbar-user-avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <span class="topbar-user-name">张三</span>
            <svg class="topbar-user-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
          <div class="topbar-user-menu">
            <a href="#" class="topbar-user-menu-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
              修改用户信息
            </a>
            <div class="topbar-user-menu-divider"></div>
            <a href="#" class="topbar-user-menu-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              退出
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-wrapper">
      <div class="main-content" style="padding: 16px 24px;">
        <div style="display: grid; grid-template-columns: 1fr 380px; gap: 24px; height: calc(100vh - 120px);">
          <!-- 左侧报告内容 -->
          <div class="card" style="display: flex; flex-direction: column; overflow: hidden; padding: 0;">
            <!-- 报告头部 -->
            <div style="padding: 20px 24px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center;">
              <div style="display: flex; align-items: center; gap: 12px;">
                <a href="02-workspace.html" style="color: var(--gray-400);">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <path d="M15 19l-7-7 7-7"/>
                  </svg>
                </a>
                <span style="font-weight: 600; color: var(--gray-800);">审查报告</span>
              </div>
              <div style="display: flex; gap: 8px;">
                <a href="06-report.html" class="btn btn-secondary">标准视图</a>
                <button class="btn btn-danger">导出 PDF</button>
              </div>
            </div>

            <!-- 报告概览 -->
            <div style="padding: 20px 24px; border-bottom: 1px solid var(--gray-200);">
              <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">
                <div style="text-align: center; padding: 12px; background: var(--gray-50); border-radius: var(--radius);">
                  <div style="font-size: 22px; font-weight: 700; color: var(--primary-color);">92%</div>
                  <div style="font-size: 12px; color: var(--gray-500);">合规检测</div>
                </div>
                <div style="text-align: center; padding: 12px; background: var(--gray-50); border-radius: var(--radius);">
                  <div style="font-size: 22px; font-weight: 700; color: var(--danger);">85%</div>
                  <div style="font-size: 12px; color: var(--gray-500);">风险识别</div>
                </div>
                <div style="text-align: center; padding: 12px; background: var(--gray-50); border-radius: var(--radius);">
                  <div style="font-size: 22px; font-weight: 700; color: var(--success);">95%</div>
                  <div style="font-size: 12px; color: var(--gray-500);">资质核验</div>
                </div>
                <div style="text-align: center; padding: 12px; background: var(--gray-50); border-radius: var(--radius);">
                  <div style="font-size: 22px; font-weight: 700; color: var(--warning);">78%</div>
                  <div style="font-size: 12px; color: var(--gray-500);">响应比对</div>
                </div>
              </div>
            </div>

            <!-- 问题列表 -->
            <div style="flex: 1; overflow-y: auto; padding: 20px 24px;">
              <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" width="18" height="18">
                  <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                需要关注的问题 (3项)
              </h3>

              <div style="display: flex; flex-direction: column; gap: 12px;">
                <div class="issue-card critical">
                  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                    <span class="risk-badge high">招标文件</span>
                    <span style="color: var(--gray-400); font-size: 12px;">[P30]</span>
                  </div>
                  <div style="font-weight: 600; font-size: 14px; color: var(--gray-800);">资格要求疑似过高</div>
                  <div style="font-size: 13px; color: var(--gray-500); margin-top: 4px;">依据：《招标投标法实施条例》第32条</div>
                </div>

                <div class="issue-card critical">
                  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                    <span class="risk-badge high">招标文件</span>
                    <span style="color: var(--gray-400); font-size: 12px;">[P52]</span>
                  </div>
                  <div style="font-weight: 600; font-size: 14px; color: var(--gray-800);">工期要求前后不一致</div>
                </div>

                <div class="issue-card warning">
                  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                    <span class="risk-badge medium">投标文件</span>
                    <span style="color: var(--gray-400); font-size: 12px;">[投标A-P38]</span>
                  </div>
                  <div style="font-weight: 600; font-size: 14px; color: var(--gray-800);">资质证书有效期临近期</div>
                </div>
              </div>
            </div>
          </div>

          <!-- 右侧智能助手 -->
          <div class="card" style="display: flex; flex-direction: column; overflow: hidden; padding: 0;">
            <div style="padding: 16px 20px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; gap: 10px;">
              <div style="width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary-color), var(--primary-light)); border-radius: var(--radius); display: flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="20" height="20">
                  <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
              </div>
              <span style="font-weight: 600; font-size: 15px;">智能助手</span>
            </div>

            <!-- 消息列表 -->
            <div id="messageList" style="flex: 1; overflow-y: auto; padding: 20px;">
              <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <div style="width: 32px; height: 32px; background: var(--gray-200); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--gray-600)" stroke-width="2" width="16" height="16">
                    <path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                  </svg>
                </div>
                <div style="padding: 12px 14px; background: var(--gray-100); border-radius: 0 10px 10px 10px; font-size: 14px; line-height: 1.5;">
                  您好！我是审查助手，有什么可以帮您？
                </div>
              </div>
            </div>

            <!-- 快捷问题 -->
            <div style="padding: 12px 20px; border-top: 1px solid var(--gray-200); background: var(--gray-50);">
              <div style="font-size: 11px; color: var(--gray-400); margin-bottom: 8px;">快捷问题：</div>
              <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                <button onclick="sendQuickQuestion('核心风险是什么？')" style="padding: 4px 10px; background: white; border: 1px solid var(--gray-300); border-radius: 14px; font-size: 12px; color: var(--gray-600); cursor: pointer;">核心风险是什么？</button>
                <button onclick="sendQuickQuestion('解释第30页问题')" style="padding: 4px 10px; background: white; border: 1px solid var(--gray-300); border-radius: 14px; font-size: 12px; color: var(--gray-600); cursor: pointer;">解释第30页问题</button>
              </div>
            </div>

            <!-- 输入框 -->
            <div style="padding: 16px 20px; border-top: 1px solid var(--gray-200); display: flex; gap: 10px;">
              <input type="text" id="chatInput" placeholder="请输入问题..." style="flex: 1; padding: 10px 14px; border: 1px solid var(--gray-300); border-radius: var(--radius); font-size: 14px;" onkeypress="handleKeyPress(event)">
              <button onclick="sendMessage()" style="padding: 10px 18px; background: var(--primary-color); color: white; border: none; border-radius: var(--radius); font-size: 14px; cursor: pointer;">发送</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const messageList = document.getElementById('messageList');
    const chatInput = document.getElementById('chatInput');

    const responses = {
      '核心风险是什么？': '根据本次审查，主要风险包括：\n\n1. 资质要求过高（P30）- 招标文件中要求"信息系统集成一级资质"，根据《招标投标法实施条例》第32条疑似过高，建议调整为二级资质。\n\n2. 工期要求不一致（P52）- 招标文件前后工期要求矛盾，P8要求60日历天，P52要求30日历天，需核实修正。\n\n3. 资质证书临期（投标A-P38）- 投标方ISO27001证书将于2026年4月15日过期，需关注。',
      '解释第30页问题': 'P30页发现的问题详情：\n\n问题：资格要求疑似过高\n\n原文："具有信息系统集成一级资质"\n\n依据：《招标投标法实施条例》第三十二条规定，招标人不得以不合理的条件限制或者排斥潜在投标人。\n\n建议：调整为"信息系统集成二级资质"，既能满足项目实际需求，又能确保足够数量的投标人参与竞争。'
    };

    function createUserMessage(text) {
      const div = document.createElement('div');
      div.style.display = 'flex';
      div.style.gap = '10px';
      div.style.marginBottom = '16px';
      div.style.justifyContent = 'flex-end';
      div.innerHTML = \`
        <div style="padding: 12px 14px; background: var(--primary-color); color: white; border-radius: 10px 0 10px 10px; font-size: 14px; line-height: 1.5; max-width: 80%;">
          \${text}
        </div>
        <div style="width: 32px; height: 32px; background: var(--primary-color); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="16" height="16">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      \`;
      return div;
    }

    function createAssistantMessage(text) {
      const div = document.createElement('div');
      div.style.display = 'flex';
      div.style.gap = '10px';
      div.style.marginBottom = '16px';
      div.innerHTML = \`
        <div style="width: 32px; height: 32px; background: var(--gray-200); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--gray-600)" stroke-width="2" width="16" height="16">
            <path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <div style="padding: 12px 14px; background: var(--gray-100); border-radius: 0 10px 10px 10px; font-size: 14px; line-height: 1.5; white-space: pre-wrap;">
          \${text}
        </div>
      \`;
      return div;
    }

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      messageList.appendChild(createUserMessage(text));
      chatInput.value = '';

      const typingIndicator = createTypingIndicator();
      messageList.appendChild(typingIndicator);
      scrollToBottom();

      setTimeout(() => {
        messageList.removeChild(typingIndicator);
        const response = responses[text] || '抱歉，我不太理解您的问题。您可以尝试询问：\n• 核心风险是什么？\n• 解释第30页问题';
        messageList.appendChild(createAssistantMessage(response));
        scrollToBottom();
      }, 1000);
    }

    function createTypingIndicator() {
      const div = document.createElement('div');
      div.style.display = 'flex';
      div.style.gap = '10px';
      div.style.marginBottom = '16px';
      div.innerHTML = \`
        <div style="width: 32px; height: 32px; background: var(--gray-200); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--gray-600)" stroke-width="2" width="16" height="16">
            <path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <div style="padding: 12px 14px; background: var(--gray-100); border-radius: 0 10px 10px 10px; font-size: 14px; line-height: 1.5;">
          <span style="display: inline-block; animation: bounce 1s infinite;">●</span>
          <span style="display: inline-block; animation: bounce 1s 0.2s infinite;">●</span>
          <span style="display: inline-block; animation: bounce 1s 0.4s infinite;">●</span>
        </div>
      \`;
      return div;
    }

    function sendQuickQuestion(question) {
      chatInput.value = question;
      sendMessage();
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function scrollToBottom() {
      messageList.scrollTop = messageList.scrollHeight;
    }
  </script>

  <style>
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }
  </style>
  <script src="sidebar.js"></script>
</body>
</html>
