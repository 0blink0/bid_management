<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在审查 - 智能招投标审查平台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-layout">
    <!-- 顶部导航栏 -->
    <header class="topbar">
      <div class="topbar-logo">
        <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" width="40" height="40">
          <defs>
            <linearGradient id="shieldMain" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1E5AA8"/>
              <stop offset="50%" stop-color="#2C7BE5"/>
              <stop offset="100%" stop-color="#1E5AA8"/>
            </linearGradient>
            <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFD700"/>
              <stop offset="100%" stop-color="#B8860B"/>
            </linearGradient>
            <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E5AA8" flood-opacity="0.3"/>
            </filter>
            <filter id="badgeShadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
            </filter>
          </defs>
          <g filter="url(#shieldShadow)">
            <path d="M22 2L4 9v10c0 10 8 17 18 17s18-7 18-17V9L22 2z" fill="url(#shieldMain)"/>
          </g>
          <path d="M22 2L4 9v10c0 10 8 17 18 17" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
          <path d="M22 36c8.5 0 15-5.5 16-13" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
          <path d="M22 2L4 9v10c0 10 8 17 18 17s18-7 18-17V9L22 2z" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <g transform="translate(14, 11)">
            <path d="M12 0H4a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V6l-4-6z" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 0v6h4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 10h6M5 13h4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </g>
          <g filter="url(#badgeShadow)" transform="translate(28, 26)">
            <circle cx="8" cy="8" r="7" fill="url(#goldBadge)" stroke="#B8860B" stroke-width="0.5"/>
            <circle cx="8" cy="8" r="5.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
            <path d="M5 8l2 2 4-4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
        <span class="topbar-title">智能招投标审查平台</span>
      </div>
      <div class="topbar-actions">
        <div class="topbar-user-dropdown">
          <div class="topbar-user">
            <div class="topbar-user-avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <span class="topbar-user-name">张三</span>
            <svg class="topbar-user-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
          <div class="topbar-user-menu">
            <a href="#" class="topbar-user-menu-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
              修改用户信息
            </a>
            <div class="topbar-user-menu-divider"></div>
            <a href="#" class="topbar-user-menu-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              退出
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-wrapper">
      <div class="main-content">
        <div style="max-width: 600px; margin: 0 auto; text-align: center;">

          <!-- 状态容器 -->
          <div id="progressContainer">
            <!-- 进度图标 -->
            <div style="margin-bottom: 32px;">
              <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-color), var(--primary-light)); margin: 0 auto; display: flex; align-items: center; justify-content: center; position: relative;">
                <svg id="progressSpinner" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="48" height="48" style="animation: spin 1.5s linear infinite;">
                  <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
                </svg>
              </div>
            </div>

            <!-- 状态文字 -->
            <h2 style="font-size: 24px; font-weight: 600; color: var(--gray-800); margin-bottom: 8px;" id="progressTitle">正在审查中...</h2>
            <p style="font-size: 14px; color: var(--gray-500); margin-bottom: 40px;" id="progressSubtitle">AI正在对文件进行多维度分析，请稍候</p>

            <!-- 审查进度列表 -->
            <div style="text-align: left; background: var(--gray-50); border-radius: var(--radius); padding: 24px;" id="reviewItems">
              <!-- 动态生成审查项目 -->
            </div>

            <!-- 文件信息 -->
            <div style="margin-top: 24px; padding: 16px 20px; background: var(--gray-50); border-radius: var(--radius); display: inline-flex; align-items: center; gap: 12px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="2" width="20" height="20">
                <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              <span style="font-size: 14px; color: var(--gray-600);" id="fileInfo">已上传 0 个文件</span>
            </div>
          </div>

          <!-- 完成容器（初始隐藏） -->
          <div id="completeContainer" style="display: none;">
            <!-- 完成图标 -->
            <div style="margin-bottom: 32px;">
              <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, var(--success), #48BB78); margin: 0 auto; display: flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" width="48" height="48">
                  <path d="M5 13l4 4L19 7"/>
                </svg>
              </div>
            </div>

            <!-- 完成文字 -->
            <h2 style="font-size: 24px; font-weight: 600; color: var(--gray-800); margin-bottom: 8px;">审查完成</h2>
            <p style="font-size: 14px; color: var(--gray-500); margin-bottom: 32px;" id="completeSummary">已完成全部审查项目</p>

            <!-- 审查结果摘要 -->
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 32px;">
              <div style="padding: 16px; background: var(--gray-50); border-radius: var(--radius);">
                <div style="font-size: 28px; font-weight: 600; color: var(--gray-800);">12</div>
                <div style="font-size: 12px; color: var(--gray-500);">发现问题</div>
              </div>
              <div style="padding: 16px; background: rgba(239, 68, 68, 0.1); border-radius: var(--radius);">
                <div style="font-size: 28px; font-weight: 600; color: #EF4444;">2</div>
                <div style="font-size: 12px; color: #EF4444;">风险预警</div>
              </div>
              <div style="padding: 16px; background: var(--success-bg); border-radius: var(--radius);">
                <div style="font-size: 28px; font-weight: 600; color: var(--success);">3</div>
                <div style="font-size: 12px; color: var(--success);">投标单位</div>
              </div>
            </div>

            <!-- 操作按钮 -->
            <div style="display: flex; gap: 12px; justify-content: center;">
              <a href="project-detail.html" class="btn btn-secondary" style="padding: 14px 28px; font-size: 15px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="margin-right: 6px;">
                  <path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                查看项目详情
              </a>
              <a href="06b-report-detail.html" class="btn btn-primary" style="padding: 14px 28px; font-size: 15px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" style="margin-right: 6px;">
                  <path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                查看审查报告
              </a>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .review-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--gray-200);
      animation: fadeIn 0.3s ease forwards;
    }
    .review-item:last-child {
      border-bottom: none;
    }
    .review-item-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gray-200);
      transition: all 0.3s;
    }
    .review-item-icon.pending {
      background: var(--gray-200);
    }
    .review-item-icon.processing {
      background: var(--primary-lighter);
    }
    .review-item-icon.completed {
      background: var(--success);
    }
    .review-item-text {
      flex: 1;
      font-size: 14px;
      color: var(--gray-600);
    }
    .review-item-status {
      font-size: 12px;
      color: var(--gray-400);
    }
    .review-item-status.processing {
      color: var(--primary-color);
    }
    .review-item-status.completed {
      color: var(--success);
    }
  </style>

  <script>
    // 获取审查配置
    const reviewData = JSON.parse(sessionStorage.getItem('reviewData') || '{"files":[],"bidding":true,"collusion":true,"qualification":true,"response":true}');

    // 审查项目列表
    const reviewItems = [
      { id: 'bidding', name: '招标文件检测', icon: 'shield', enabled: reviewData.bidding },
      { id: 'qualification', name: '资质核验', icon: 'clipboard', enabled: reviewData.qualification },
      { id: 'collusion', name: '围串标检测', icon: 'lock', enabled: reviewData.collusion },
      { id: 'response', name: '响应比对', icon: 'chart', enabled: reviewData.response }
    ].filter(item => item.enabled);

    // 显示文件信息
    document.getElementById('fileInfo').textContent = '已上传 ' + (reviewData.files?.length || 0) + ' 个文件';

    // 渲染审查项目列表
    const reviewItemsContainer = document.getElementById('reviewItems');
    reviewItemsContainer.innerHTML = reviewItems.map((item, index) => `
      <div class="review-item" id="reviewItem_${item.id}" style="opacity: 0;">
        <div class="review-item-icon pending" id="icon_${item.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="18" height="18" id="svg_${item.id}">
            <circle cx="12" cy="12" r="10"/>
          </svg>
        </div>
        <div class="review-item-text">${item.name}</div>
        <div class="review-item-status" id="status_${item.id}">等待中</div>
      </div>
    `).join('');

    // 依次执行审查项目
    let completedCount = 0;
    reviewItems.forEach((item, index) => {
      setTimeout(() => {
        // 设置为进行中
        const icon = document.getElementById('icon_' + item.id);
        const svg = document.getElementById('svg_' + item.id);
        const status = document.getElementById('status_' + item.id);
        const el = document.getElementById('reviewItem_' + item.id);

        icon.className = 'review-item-icon processing';
        svg.innerHTML = '<path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>';
        svg.style.animation = 'spin 1s linear infinite';
        status.className = 'review-item-status processing';
        status.textContent = '分析中...';
        el.style.opacity = '1';

        // 模拟完成
        setTimeout(() => {
          icon.className = 'review-item-icon completed';
          svg.innerHTML = '<path d="M5 13l4 4L19 7"/>';
          svg.style.animation = 'none';
          status.className = 'review-item-status completed';
          status.textContent = '已完成';

          completedCount++;
          document.getElementById('progressSubtitle').textContent = `已完成 ${completedCount}/${reviewItems.length} 项审查...`;

          // 全部完成
          if (completedCount === reviewItems.length) {
            setTimeout(showComplete, 500);
          }
        }, 1500 + Math.random() * 1000);
      }, index * 800);
    });

    // 显示完成状态
    function showComplete() {
      document.getElementById('progressContainer').style.display = 'none';
      document.getElementById('completeContainer').style.display = 'block';

      // 生成摘要信息
      const summary = reviewItems.map(item => item.name).join('、');
      document.getElementById('completeSummary').textContent = '已完成：' + summary;
    }
  </script>
  <script src="sidebar.js"></script>
</body>
</html>
