<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 智能招投标审查平台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-layout">
    <!-- 顶部导航栏 -->
    <header class="topbar">
      <div class="topbar-logo">
        <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" width="40" height="40">
          <defs>
            <linearGradient id="shieldMain" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1E5AA8"/>
              <stop offset="50%" stop-color="#2C7BE5"/>
              <stop offset="100%" stop-color="#1E5AA8"/>
            </linearGradient>
            <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFD700"/>
              <stop offset="100%" stop-color="#B8860B"/>
            </linearGradient>
            <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E5AA8" flood-opacity="0.3"/>
            </filter>
            <filter id="badgeShadow" x="-50%" y="-50%" width="200%" height="200%">
              <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
            </filter>
          </defs>
          <!-- 盾牌主体 -->
          <g filter="url(#shieldShadow)">
            <path d="M22 2L4 9v10c0 10 8 17 18 17s18-7 18-17V9L22 2z" fill="url(#shieldMain)"/>
          </g>
          <!-- 盾牌顶部高光 -->
          <path d="M22 2L4 9v10c0 10 8 17 18 17" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
          <!-- 盾牌底部暗部 -->
          <path d="M22 36c8.5 0 15-5.5 16-13" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
          <!-- 盾牌边缘轮廓 -->
          <path d="M22 2L4 9v10c0 10 8 17 18 17s18-7 18-17V9L22 2z" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
          <!-- 文档图标 -->
          <g transform="translate(14, 11)">
            <path d="M12 0H4a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V6l-4-6z" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 0v6h4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 10h6M5 13h4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </g>
          <!-- 金色徽章 -->
          <g filter="url(#badgeShadow)" transform="translate(28, 26)">
            <circle cx="8" cy="8" r="7" fill="url(#goldBadge)" stroke="#B8860B" stroke-width="0.5"/>
            <circle cx="8" cy="8" r="5.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
            <path d="M5 8l2 2 4-4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
        <span>智能招投标审查平台</span>
      </div>
      <div class="topbar-actions">
        <div class="topbar-user-dropdown">
          <div class="topbar-user">
            <div class="topbar-user-avatar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <span class="topbar-user-name">张三</span>
            <svg class="topbar-user-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
          <div class="topbar-user-menu">
            <a href="#" class="topbar-user-menu-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
              </svg>
              修改用户信息
            </a>
            <div class="topbar-user-menu-divider"></div>
            <a href="#" class="topbar-user-menu-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              退出
            </a>
          </div>
        </div>
      </div>
    </header>


    <!-- 主内容区 -->
    <main class="main-wrapper">
      <div class="main-content">
        <div style="max-width: 900px;">
          <!-- 页面标题 -->
          <div class="page-header" style="margin-bottom: 24px;">
            <div style="display: flex; align-items: center; gap: 16px;">
              <a href="08-admin.html" style="color: var(--gray-500);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                  <path d="M15 19l-7-7 7-7"/>
                </svg>
              </a>
              <h1 class="page-title">用户管理</h1>
            </div>
            <button onclick="showAddUserModal()" class="btn btn-primary">添加用户</button>
          </div>

          <!-- 用户列表 -->
          <div class="card" style="padding: 0; overflow: hidden;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>用户名</th>
                  <th>姓名</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>zhangsan</td>
                  <td>张三</td>
                  <td><span class="role-badge admin">管理员</span></td>
                  <td><span class="status-badge success">启用</span></td>
                  <td>
                    <button onclick="showEditUserModal()" class="btn-link">编辑</button>
                  </td>
                </tr>
                <tr>
                  <td>lisi</td>
                  <td>李四</td>
                  <td><span class="role-badge user">普通账户</span></td>
                  <td><span class="status-badge success">启用</span></td>
                  <td>
                    <button onclick="showEditUserModal()" class="btn-link">编辑</button>
                    <button onclick="toggleUserStatus(this)" class="btn-link danger">禁用</button>
                  </td>
                </tr>
                <tr>
                  <td>wangwu</td>
                  <td>王五</td>
                  <td><span class="role-badge user">普通账户</span></td>
                  <td><span class="status-badge danger">禁用</span></td>
                  <td>
                    <button onclick="showEditUserModal()" class="btn-link">编辑</button>
                    <button onclick="toggleUserStatus(this)" class="btn-link success">启用</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <!-- 添加/编辑用户模态框 -->
    <div class="modal-overlay" id="userModal">
      <div class="modal" style="max-width: 480px;">
        <div class="modal-header">
          <h3 id="modalTitle" style="font-size: 18px; font-weight: 600;">添加用户</h3>
          <button onclick="closeUserModal()" class="modal-close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
              <path d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">用户名</label>
            <input type="text" placeholder="请输入用户名" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">姓名</label>
            <input type="text" placeholder="请输入姓名" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">角色</label>
            <div style="display: flex; gap: 20px;">
              <label class="radio-label">
                <input type="radio" name="role" value="admin"> 管理员
              </label>
              <label class="radio-label">
                <input type="radio" name="role" value="user" checked> 普通账户
              </label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">初始密码</label>
            <input type="password" placeholder="请输入初始密码" class="form-input">
          </div>
        </div>
        <div class="modal-footer">
          <button onclick="closeUserModal()" class="btn btn-secondary">取消</button>
          <button class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <style>
    .role-badge {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .role-badge.admin {
      background: rgba(30, 90, 168, 0.1);
      color: var(--primary-color);
    }
    .role-badge.user {
      background: var(--gray-100);
      color: var(--gray-600);
    }
    .btn-link {
      padding: 4px 12px;
      border: 1px solid var(--primary-color);
      border-radius: 4px;
      background: transparent;
      font-size: 13px;
      cursor: pointer;
      color: var(--primary-color);
    }
    .btn-link.danger {
      color: var(--danger);
      border-color: var(--danger);
      margin-left: 8px;
    }
    .btn-link.success {
      color: var(--success);
      border-color: var(--success);
      margin-left: 8px;
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gray-400);
    }
    .modal-body {
      padding: 24px;
    }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--gray-200);
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--gray-700);
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary-color);
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>

  <script>
    function showAddUserModal() {
      document.getElementById('modalTitle').textContent = '添加用户';
      document.getElementById('userModal').classList.add('active');
    }
    function showEditUserModal() {
      document.getElementById('modalTitle').textContent = '编辑用户';
      document.getElementById('userModal').classList.add('active');
    }
    function closeUserModal() {
      document.getElementById('userModal').classList.remove('active');
    }
    function toggleUserStatus(btn) {
      const row = btn.closest('tr');
      const cells = row.querySelectorAll('td');
      const statusSpan = cells[3].querySelector('.status-badge');
      const isEnabled = statusSpan.classList.contains('success');

      if (isEnabled) {
        statusSpan.classList.remove('success');
        statusSpan.classList.add('danger');
        statusSpan.textContent = '禁用';
        btn.textContent = '启用';
        btn.classList.remove('danger');
        btn.classList.add('success');
      } else {
        statusSpan.classList.remove('danger');
        statusSpan.classList.add('success');
        statusSpan.textContent = '启用';
        btn.textContent = '禁用';
        btn.classList.remove('success');
        btn.classList.add('danger');
      }
    }
  </script>
  <script src="sidebar.js"></script>
</body>
</html>
