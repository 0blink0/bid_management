<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据统计 - 智能招投标审查平台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-layout">
    <header class="topbar"><div class="topbar-logo"><svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" width="40" height="40"><defs><linearGradient id="shieldMain" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1E5AA8"/><stop offset="50%" stop-color="#2C7BE5"/><stop offset="100%" stop-color="#1E5AA8"/></linearGradient><linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/></linearGradient></defs><g filter="url(#shieldShadow)"><path d="M22 2L4 9v10c0 10 8 17 18 17s18-7 18-17V9L22 2z" fill="url(#shieldMain)"/></g><g transform="translate(14, 11)"><path d="M12 0H4a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V6l-4-6z" fill="none" stroke="white" stroke-width="1.8"/><path d="M12 0v6h4" stroke="white" stroke-width="1.8"/></g><g filter="url(#badgeShadow)" transform="translate(28, 26)"><circle cx="8" cy="8" r="7" fill="url(#goldBadge)"/><path d="M5 8l2 2 4-4" stroke="white" stroke-width="1.8"/></g></svg><span class="topbar-title">智能招投标审查平台</span></div><div class="topbar-actions"><div class="topbar-user-dropdown"><div class="topbar-user"><div class="topbar-user-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span class="topbar-user-name">张三</span></div></div></div></header>
    <main class="main-wrapper"><div class="main-content"><div style="max-width: 1200px;">
      <div class="page-header" style="margin-bottom: 24px;"><div><h1 class="page-title">数据统计</h1><p class="text-muted mt-8">多维度统计分析项目风险、问题分布、整改情况</p></div></div>
      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;">
        <div class="stat-card"><div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg></div><div class="stat-value">156</div><div class="stat-label">总项目数</div></div>
        <div class="stat-card"><div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div><div class="stat-value">128</div><div class="stat-label">已完成</div></div>
        <div class="stat-card"><div class="stat-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg></div><div class="stat-value">45</div><div class="stat-label">风险预警</div></div>
        <div class="stat-card"><div class="stat-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></div><div class="stat-value">89%</div><div class="stat-label">整改完成率</div></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
        <div class="card"><div class="card-header"><h3 class="card-title">问题类型分布</h3></div><div style="padding: 20px;"><div style="margin-bottom: 12px;"><div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span>合规性问题</span><span>35%</span></div><div style="height: 8px; background: var(--gray-200); border-radius: 4px;"><div style="width: 35%; height: 100%; background: var(--primary-color); border-radius: 4px;"></div></div></div><div style="margin-bottom: 12px;"><div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span>响应性问题</span><span>28%</span></div><div style="height: 8px; background: var(--gray-200); border-radius: 4px;"><div style="width: 28%; height: 100%; background: var(--warning); border-radius: 4px;"></div></div></div><div style="margin-bottom: 12px;"><div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span>资质问题</span><span>22%</span></div><div style="height: 8px; background: var(--gray-200); border-radius: 4px;"><div style="width: 22%; height: 100%; background: var(--danger); border-radius: 4px;"></div></div></div><div><div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span>格式问题</span><span>15%</span></div><div style="height: 8px; background: var(--gray-200); border-radius: 4px;"><div style="width: 15%; height: 100%; background: var(--gray-500); border-radius: 4px;"></div></div></div></div></div>
        <div class="card"><div class="card-header"><h3 class="card-title">月度审查趋势</h3></div><div style="padding: 20px; text-align: center; color: var(--gray-500);">[图表区域]<br><span style="font-size: 13px;">显示近6个月审查数量趋势</span></div></div>
      </div>
    </div></div></main>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
