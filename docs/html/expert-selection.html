<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专家抽取 - 智能招投标审查平台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-layout">
    <header class="topbar"><div class="topbar-logo"><svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" width="40" height="40"><defs><linearGradient id="shieldMain" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1E5AA8"/><stop offset="50%" stop-color="#2C7BE5"/><stop offset="100%" stop-color="#1E5AA8"/></linearGradient><linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/></linearGradient></defs><g filter="url(#shieldShadow)"><path d="M22 2L4 9v10c0 10 8 17 18 17s18-7 18-17V9L22 2z" fill="url(#shieldMain)"/></g><g transform="translate(14, 11)"><path d="M12 0H4a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V6l-4-6z" fill="none" stroke="white" stroke-width="1.8"/><path d="M12 0v6h4" stroke="white" stroke-width="1.8"/></g><g filter="url(#badgeShadow)" transform="translate(28, 26)"><circle cx="8" cy="8" r="7" fill="url(#goldBadge)"/><path d="M5 8l2 2 4-4" stroke="white" stroke-width="1.8"/></g></svg><span class="topbar-title">智能招投标审查平台</span></div><div class="topbar-actions"><div class="topbar-user-dropdown"><div class="topbar-user"><div class="topbar-user-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span class="topbar-user-name">张三</span></div></div></div></header>
    <main class="main-wrapper"><div class="main-content"><div style="max-width: 1200px;">
      <div class="page-header" style="margin-bottom: 24px;"><div><h1 class="page-title">专家抽取</h1><p class="text-muted mt-8">随机抽取评标专家，保障评标公正性</p></div></div>
      <div class="card" style="margin-bottom: 24px;">
        <div class="card-header"><h3 class="card-title">抽取条件设置</h3></div>
        <div style="padding: 20px;">
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
            <div class="form-group"><label class="form-label">项目名称</label><input type="text" class="form-input" value="某市政府云平台建设项目" readonly></div>
            <div class="form-group"><label class="form-label">抽取人数</label><input type="number" class="form-input" value="5"></div>
            <div class="form-group"><label class="form-label">专业分类</label><select class="form-input"><option>计算机系统集成</option><option>网络工程</option><option>软件工程</option></select></div>
            <div class="form-group"><label class="form-label">回避条件</label><select class="form-input"><option>无</option><option>与投标单位有利益关系</option></select></div>
          </div>
          <div style="margin-top: 20px;"><button class="btn btn-primary">开始抽取</button></div>
        </div>
      </div>
      <div class="card" style="padding: 0; overflow: hidden;">
        <div class="card-header"><h3 class="card-title">抽取结果</h3><span class="text-muted">共抽取 5 名专家</span></div>
        <table class="data-table"><thead><tr><th>序号</th><th>姓名</th><th>专业</th><th>职称</th><th>工作单位</th><th>抽取时间</th></tr></thead>
        <tbody>
          <tr><td>1</td><td>王建国</td><td>计算机系统集成</td><td>高级工程师</td><td>某大学计算机学院</td><td>2026-03-27 14:30</td></tr>
          <tr><td>2</td><td>李明</td><td>软件工程</td><td>教授</td><td>某研究院</td><td>2026-03-27 14:30</td></tr>
          <tr><td>3</td><td>张华</td><td>网络工程</td><td>高级工程师</td><td>某设计院</td><td>2026-03-27 14:30</td></tr>
          <tr><td>4</td><td>陈刚</td><td>项目管理</td><td>高级经济师</td><td>某国有企业</td><td>2026-03-27 14:30</td></tr>
          <tr><td>5</td><td>刘洋</td><td>信息安全</td><td>高级工程师</td><td>某市公安局</td><td>2026-03-27 14:30</td></tr>
        </tbody>
      </div>
    </div></div></main>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
